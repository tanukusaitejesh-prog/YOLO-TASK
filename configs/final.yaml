# ─────────────────────────────────────────────────────────────
# Experiment 4 — Final Candidate
#
# Finalise this config ONLY after reviewing Exp 2 and Exp 3 results.
# Combine only the changes that were supported by measured evidence.
#
# Tentative plan (adjust based on results):
#   imgsz 800  — moderate resolution gain, keeps latency manageable
#   augmentation from Exp 2 — if it showed recall / mAP improvement
#
# Rationale for 800 not 960:
#   If Exp 3 showed diminishing returns above 800, and latency increased
#   significantly, 800 is the right balance point.
# ─────────────────────────────────────────────────────────────

experiment: final

model: yolov8n.pt

imgsz:          800       # moderate increase (adjust if evidence suggests otherwise)
epochs:         100
batch:          12        # adjusted for 800x800
lr0:            0.01
lrf:            0.01
momentum:       0.937
weight_decay:   0.0005
warmup_epochs:  3
seed:           42

# Augmentation from Experiment 2 (if supported by evidence)
hsv_h:          0.015
hsv_s:          0.7
hsv_v:          0.6
degrees:        5.0
translate:      0.1
scale:          0.65
shear:          2.0
perspective:    0.0005
flipud:         0.0
fliplr:         0.5
mosaic:         1.0
mixup:          0.1
copy_paste:     0.0
