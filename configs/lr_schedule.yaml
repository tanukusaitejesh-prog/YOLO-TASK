# ─────────────────────────────────────────────────────────────
# Experiment 5 — Learning Rate Schedule
#
# Hypothesis:
#   YOLOv8n is already pretrained on COCO. Starting with the default
#   lr0=0.01 may overshoot the fine-tuned weight distribution early in
#   training, causing loss instability. A 10x lower initial learning rate
#   (lr0=0.001) combined with cosine annealing (lrf=0.001) should allow
#   smoother convergence around the pretrained weights, potentially
#   improving strict bounding box localization (mAP@0.5:0.95).
#
# Changed vs Baseline (one factor group — LR schedule only):
#   lr0  0.01  → 0.001   10× lower warm-start learning rate
#   lrf  0.01  → 0.001   cosine decay floor matches new start
#
# Held constant vs Baseline:
#   model (yolov8n), imgsz (640), batch (16), epochs (100),
#   all augmentation params, seed (42)
# ─────────────────────────────────────────────────────────────

experiment: lr_schedule

# ── Model ─────────────────────────────────────────────────────
model: yolov8n.pt

imgsz:          640
epochs:         100
batch:          16
optimizer:      AdamW
lr0:            0.001     # ← 10x lower initial LR (fine-tuning regime)
lrf:            0.001     # ← cosine annealing floor
momentum:       0.937
weight_decay:   0.0005
warmup_epochs:  3
seed:           42

# ── Augmentation (identical to Baseline — not the variable being tested) ──
hsv_h:          0.015
hsv_s:          0.7
hsv_v:          0.4
degrees:        0.0
translate:      0.1
scale:          0.5
shear:          0.0
perspective:    0.0
flipud:         0.0
fliplr:         0.5
mosaic:         1.0
mixup:          0.0
copy_paste:     0.0
